# Dedicated CECP-IEM test instance. No listener or redirect on port 80.
# Start with the supplied scripts; prefix is C:/nginx/.
worker_processes 1;
pid logs/cecp-iem.pid;
error_log logs/cecp-iem-error.log warn;

events {
    worker_connections 256;
}

http {
    access_log logs/cecp-iem-access.log;
    server_tokens off;
    client_max_body_size 16k;
    client_body_timeout 15s;
    keepalive_timeout 30s;

    server {
        listen 192.168.50.10:8088;
        listen 127.0.0.1:8088;
        server_name monitor.cecp.it;

        # Preserve the application's LAN boundary at the proxy, since Node
        # sees every proxied connection as 127.0.0.1.
        allow 127.0.0.1;
        allow 192.168.50.0/24;
        deny all;

        location / {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            # $http_host retains the original port, e.g. monitor.cecp.it:8088.
            proxy_set_header Host $http_host;
            proxy_set_header Connection "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_connect_timeout 5s;
            proxy_read_timeout 90s;
            proxy_send_timeout 90s;
            proxy_buffering off;
            proxy_cache off;
            proxy_next_upstream off;
        }
    }
}
