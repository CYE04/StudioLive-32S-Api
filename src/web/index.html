<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#171a1d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>CECP IEM · 个人监听</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body class="is-login">
<div class="mixer-art" aria-hidden="true"></div>
<header class="masthead">
  <div class="brand">
    <div class="brand-logos" aria-label="帕多瓦华人教会与 Youth 标志">
      <img class="church-logo" src="/logo.png" alt="帕多瓦华人教会 Logo">
      <span class="brand-divider" aria-hidden="true"></span>
      <span class="youth-logo" role="img" aria-label="Youth Logo"></span>
    </div>
    <div class="brand-text">
      <span class="brand-sub">StudioLive 32S · 个人监听</span>
    </div>
  </div>
  <div class="masthead-right">
    <button type="button" class="theme-switch-btn" id="theme-switch-nav" aria-label="切换深色/浅色配色">切换浅色</button>
  </div>
</header>

<main>
<section id="login-panel" class="login-panel">
  <div class="login-card">
    <div class="card-system-bar">
      <span class="system-tag">舞台个人监听</span>
    </div>
    <div class="login-header">
      <h1 class="login-title">进入个人监听</h1>
      <p class="login-subtitle">使用分配给你的用户和 8 位密码登录</p>
    </div>

    <form id="login-form" class="login-form">
      <div class="form-field">
        <label for="account">用户</label>
        <div class="login-input-wrap"><svg class="login-field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><circle cx="12" cy="7" r="4"/><path d="M4 22v-3a8 8 0 0 1 16 0v3"/></svg><input id="account" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required maxlength="32" placeholder="请输入用户"></div>
      </div>

      <div class="form-field">
        <label for="pin">密码</label>
        <div class="pin-box login-input-wrap"><svg class="login-field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><rect x="4" y="10" width="16" height="12" rx="2"/><path d="M7 10V6a5 5 0 0 1 10 0v4M12 15v3"/></svg>
          <input id="pin" type="password" name="password" inputmode="numeric" pattern="[0-9]{8}" autocomplete="current-password" required minlength="8" maxlength="8" placeholder="请输入 8 位密码">
          <button type="button" id="toggle-pin" class="toggle-pin-btn" aria-label="显示或隐藏密码" title="显示或隐藏密码"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button>
        </div>
      </div>

      <button id="login-button" class="btn-login" type="submit">
        <span>登录</span>
        <span class="arrow-icon" aria-hidden="true">→</span>
      </button>

      <p id="login-error" class="login-error-msg" role="alert"></p>
      <p class="login-note">登录后只显示分配给你的监听混音。</p>
    </form>
  </div>
</section>

<section id="mix-panel" hidden>
  <div class="page-heading">
    <div>
      <span class="eyebrow-console">个人监听</span>
      <h1 id="mix-heading">我的监听</h1>
      <p id="account-label" class="muted-console"></p>
    </div>
    <button id="logout" class="quiet-btn">退出</button>
  </div>

  <div class="status-bar">
    <div class="status-left">
      <span id="connection" role="status">正在连接调音台…</span>
    </div>
    <div class="status-actions">
      <button type="button" id="toggle-demo" class="demo-btn">开启演示模式</button>
      <button id="reconnect" class="reconnect-btn" hidden>重新连接</button>
    </div>
  </div>
  <p id="notice" class="notice-console"></p>

  <!-- 离线待机提示：没连接时显示，保持界面干净 -->
  <div id="offline-prompt" class="offline-prompt">
    <div class="offline-icon" aria-hidden="true">—</div>
    <h3>调音台尚未连接</h3>
    <p>请确认电脑与 StudioLive 32S 在同一局域网，然后重新连接。</p>
  </div>

  <!-- 实机连接或主动开启演示时显示 -->
  <div id="mix-body" hidden>
    <div class="toolbar">
      <div class="filter-tabs">
        <button type="button" class="tab-btn active" data-filter="all">全部通道</button>
        <button type="button" class="tab-btn" data-filter="starred">常用收藏</button>
        <button type="button" class="tab-btn" data-filter="vocal">话筒人声</button>
        <button type="button" class="tab-btn" data-filter="instrument">乐器伴奏</button>
      </div>
      <div class="toolbar-right">
        <div class="mix-box">
          <label class="mix-label" for="mix-select">我的监听</label>
          <select id="mix-select" aria-label="选择我的混音"></select>
        </div>
        <label class="search-label">
          <span class="sr-only">搜索通道</span>
          <input id="search" type="search" placeholder="搜索通道名称或编号…" autocomplete="off">
        </label>
      </div>
    </div>

    <div class="instructions-console">
      <strong>通道发送量</strong>
      <span>拖动推子调节 · 两侧按钮每次微调 1%</span>
    </div>

    <div id="channels" class="channels-stack"></div>
    <p id="empty" class="empty-console" hidden>没有找到匹配的通道。</p>
    <footer>只控制当前耳返发送音量。数值以调音台实时反馈为准。</footer>
  </div>
  <!-- 自定义通道编辑弹窗 -->
  <dialog id="edit-channel-modal" class="console-modal">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="modal-channel-title">自定义通道设置</h3>
        <button type="button" id="modal-close" class="modal-close-btn" aria-label="关闭">✕</button>
      </div>
      <form id="edit-channel-form">
        <div class="modal-field">
          <label for="edit-channel-name">通道名称</label>
          <input type="text" id="edit-channel-name" maxlength="20" required placeholder="例如：S: verde 或 绿领唱">
        </div>

        <div class="modal-field">
          <label>选择 UC 配色</label>
          <div class="color-picker-grid" id="color-picker-grid"></div>
        </div>

        <div class="modal-field">
          <label>选择图标</label>
          <div class="icon-picker-grid" id="icon-picker-grid"></div>
        </div>

        <div class="modal-actions">
          <button type="button" id="modal-cancel" class="quiet-btn">取消</button>
          <button type="submit" id="modal-save" class="demo-btn">保存设置</button>
        </div>
      </form>
    </div>
  </dialog>
</main>
</body>
</html>
